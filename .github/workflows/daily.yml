name: Daily Purana stories
on:
  schedule:
    - cron: '45 14 * * *'   # GitHub runs this late and unreliably; it only stages the next video, it does not decide posting time
  workflow_dispatch:
    inputs:
      mode:
        description: 'stage = render next story into media/ | post = post staged story to Facebook + Instagram now, then stage the next | test = render a story, post nothing'
        type: choice
        options: [stage, post, test]
        default: stage
      story:
        description: 'Story id (only for mode test)'
        required: false
        default: ''
permissions:
  contents: write
concurrency: purana-daily
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FACELESS_HOME: ${{ github.workspace }}/.cache
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install numpy scipy kokoro-onnx
      - run: npm i --no-save playwright-core
      - uses: actions/cache@v4
        with: { path: .cache/kokoro, key: kokoro-v1 }
      - run: python scripts/voice.py --download
      - name: Run
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POST_FROM_SCHEDULE: ${{ vars.POST_FROM_SCHEDULE }}
          MODE: ${{ github.event.inputs.mode || 'stage' }}
          STORY: ${{ github.event.inputs.story }}
          PUBLISH: ${{ vars.PUBLISH }}
        run: |
          if [ "$MODE" = "test" ]; then
            python scripts/run_daily.py --story "${STORY:-002-prahlada-2}"
          elif [ "$MODE" = "post" ] && [ "$PUBLISH" != "true" ]; then
            echo "PUBLISH is not true: refusing to post"; exit 1
          else
            python scripts/run_daily.py --mode "$MODE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rendered, path: out/, if-no-files-found: ignore }
